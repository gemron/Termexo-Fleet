name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-npm:
    name: Frontend & npm Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop-ui ci

      - name: Build Angular desktop UI
        run: npm run build

      - name: Run frontend Vitest unit tests
        run: npm test

      - name: Run npm launcher tests
        run: npm run test:npm

  rust-workspace:
    name: Rust Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux Tauri & Secret Service dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            gnome-keyring

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Build frontend assets for Tauri compile checks
        run: |
          npm --prefix apps/desktop-ui ci
          npm run build

      - name: Run Rust workspace unit tests (Linux with Secret Service)
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/termexo-fleet-keyring
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets \
              --control-directory="$XDG_DATA_HOME/control"
            cargo test --workspace --lib --bins
          '

      - name: Run Rust workspace unit tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo test --workspace --lib --bins
