name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-npm:
    name: Frontend & npm Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop-ui ci

      - name: Build Angular desktop UI
        run: npm run build

      - name: Run frontend Vitest unit tests
        run: npm test

      - name: Run npm launcher tests
        run: npm run test:npm

  rust-workspace:
    name: Rust Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libsecret-1-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 24 & build frontendDist for Tauri compile checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Build frontend assets
        run: |
          npm --prefix apps/desktop-ui ci
          npm run build

      - name: Run Rust workspace unit tests
        run: cargo test --workspace --lib --bins
