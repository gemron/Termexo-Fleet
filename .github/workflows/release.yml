name: Release desktop and npm

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v0.1.0 or v0.2.0-preview.1). Defaults to package.json version."
        required: false
        type: string
      publish_npm:
        description: "Publish bundled multi-platform termexo-fleet package to npmjs.org"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build, bundle, and verify all payloads without publishing Release or npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_dist_tag: ${{ steps.version.outputs.npm_dist_tag }}
      publish_npm: ${{ steps.version.outputs.publish_npm }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            PUBLISH_NPM="true"
            DRY_RUN="false"
          else
            INPUT_TAG="${{ inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              PKG_VER="$(node -p "require('./package.json').version")"
              TAG="v${PKG_VER}"
            fi
            PUBLISH_NPM="${{ inputs.publish_npm }}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi

          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer release tag: $TAG" >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
            NPM_DIST_TAG="next"
          else
            PRERELEASE="false"
            NPM_DIST_TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$NPM_DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "publish_npm=$PUBLISH_NPM" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Validated Termexo Fleet $TAG (version=$VERSION, prerelease=$PRERELEASE, npm_dist_tag=$NPM_DIST_TAG)"
      - run: npm --prefix apps/desktop-ui ci
      - run: npm run build
      - run: npm test
      - run: npm --prefix packages/termexo-fleet test

  windows:
    name: Build Windows and npm payload
    needs: validate
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  macos:
    name: Build macOS (Apple Silicon & Intel)
    needs: validate
    uses: ./.github/workflows/macos-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  linux:
    name: Build Linux and test npm payload
    needs: validate
    uses: ./.github/workflows/linux-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish GitHub Release and npm
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      NPM_DIST_TAG: ${{ needs.validate.outputs.npm_dist_tag }}
      PUBLISH_NPM: ${{ needs.validate.outputs.publish_npm }}
      DRY_RUN: ${{ needs.validate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: Termexo-Fleet-*
          path: downloaded

      - name: Verify build origins and assemble multiplatform npm payloads
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';

          const { VERSION: version, GITHUB_SHA: commit } = process.env;
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          mkdirSync('release-assets', { recursive: true });

          const targets = [
            ['Windows', 'x86_64-pc-windows-msvc'],
            ['macOS', 'aarch64-apple-darwin'],
            ['macOS', 'x86_64-apple-darwin'],
            ['Linux', 'x86_64-unknown-linux-gnu'],
          ];

          for (const [platform, target] of targets) {
            const dir = `downloaded/Termexo-Fleet-${platform}-${target}`;
            const info = JSON.parse(readFileSync(`${dir}/build-info.json`, 'utf8'));
            assert.equal(info.version, version, `${target}: wrong version`);
            assert.equal(info.commit, commit, `${target}: wrong source commit`);
            assert.equal(info.target, target, `${target}: wrong architecture`);
            if (platform === 'Linux') {
              assert.equal(info.dirty, false, 'Linux release must come from a clean CI source commit');
            }

            const entries = readFileSync(`${dir}/SHA256SUMS.txt`, 'utf8').trim().split(/\r?\n/);
            assert.equal(entries.length, 2, `${target}: expected two installers/archives`);
            for (const entry of entries) {
              const match = entry.match(/^([a-f0-9]{64})  ([^/\\]+)$/);
              assert.ok(match, `Invalid checksum entry in ${target}: ${entry}`);
              const [, hash, name] = match;
              assert.ok(name.includes(`_${version}_`), `${name}: wrong version`);
              assert.equal(sha256(readFileSync(`${dir}/${name}`)), hash, `${name}: checksum mismatch`);
              copyFileSync(`${dir}/${name}`, `release-assets/${name}`);
            }
            copyFileSync(`${dir}/build-info.json`, `release-assets/build-info-${target}.json`);
          }

          // Assemble bundled vendor payloads inside packages/termexo-fleet/
          const npmWinDir = 'downloaded/Termexo-Fleet-npm-windows';
          const winInfo = JSON.parse(readFileSync(`${npmWinDir}/build-info.json`, 'utf8'));
          assert.equal(winInfo.version, version);
          assert.equal(winInfo.commit, commit);
          assert.equal(winInfo.target, 'x86_64-pc-windows-msvc');
          mkdirSync('packages/termexo-fleet/vendor/win32-x64', { recursive: true });
          const winExeBytes = readFileSync(`${npmWinDir}/termexo-fleet.exe`);
          assert.equal(sha256(winExeBytes), winInfo.executableSha256, 'termexo-fleet.exe checksum mismatch');
          copyFileSync(`${npmWinDir}/termexo-fleet.exe`, 'packages/termexo-fleet/vendor/win32-x64/termexo-fleet.exe');

          for (const [arch, archiveArch] of [['arm64', 'arm64'], ['x64', 'x86_64']]) {
            mkdirSync(`packages/termexo-fleet/vendor/darwin-${arch}`, { recursive: true });
            copyFileSync(
              `release-assets/Termexo-Fleet_${version}_${archiveArch}.app.tar.gz`,
              `packages/termexo-fleet/vendor/darwin-${arch}/Termexo Fleet.app.tar.gz`,
            );
          }

          mkdirSync('packages/termexo-fleet/vendor/linux-x64', { recursive: true });
          copyFileSync(
            `release-assets/Termexo-Fleet_${version}_linux_x64.tar.gz`,
            'packages/termexo-fleet/vendor/linux-x64/Termexo-Fleet.tar.gz',
          );

          const manifestPath = 'packages/termexo-fleet/package.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          manifest.version = version;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Test and pack the complete multiplatform npm distribution
        run: |
          npm --prefix packages/termexo-fleet test
          npm pack ./packages/termexo-fleet --pack-destination release-assets

      - name: Verify packaged platform payloads and write unified SHA256SUMS.txt
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';

          const { VERSION: version, GITHUB_SHA: commit } = process.env;
          const archive = `release-assets/termexo-fleet-${version}.tgz`;
          const archiveBytes = readFileSync(archive);
          assert.ok(archiveBytes.length <= 180_000_000, 'npm archive exceeds 180 MB upload budget');

          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const unpack = (rel) =>
            execFileSync('tar', ['-xOf', archive, `package/${rel}`], { maxBuffer: 128 * 1024 * 1024 });

          const pkg = JSON.parse(unpack('package.json'));
          assert.equal(pkg.name, 'termexo-fleet');
          assert.equal(pkg.version, version);
          assert.deepEqual(pkg.os, ['win32', 'darwin', 'linux']);

          const winInfo = JSON.parse(readFileSync('downloaded/Termexo-Fleet-npm-windows/build-info.json', 'utf8'));
          assert.equal(
            sha256(unpack('vendor/win32-x64/termexo-fleet.exe')),
            winInfo.executableSha256,
            'npm must contain the verified Windows executable',
          );
          for (const [arch, archiveArch] of [['arm64', 'arm64'], ['x64', 'x86_64']]) {
            assert.equal(
              sha256(unpack(`vendor/darwin-${arch}/Termexo Fleet.app.tar.gz`)),
              sha256(readFileSync(`release-assets/Termexo-Fleet_${version}_${archiveArch}.app.tar.gz`)),
              `macOS ${arch} payload checksum mismatch`,
            );
          }
          assert.equal(
            sha256(unpack('vendor/linux-x64/Termexo-Fleet.tar.gz')),
            sha256(readFileSync(`release-assets/Termexo-Fleet_${version}_linux_x64.tar.gz`)),
            'Linux x64 payload checksum mismatch',
          );

          writeFileSync(
            'release-assets/build-info-npm.json',
            `${JSON.stringify(
              {
                version,
                commit,
                platforms: ['win32-x64', 'darwin-arm64', 'darwin-x64', 'linux-x64'],
                packageSha256: sha256(archiveBytes),
                packageBytes: archiveBytes.length,
              },
              null,
              2,
            )}\n`,
          );

          const files = readdirSync('release-assets').filter((n) => n !== 'SHA256SUMS.txt').sort();
          writeFileSync(
            'release-assets/SHA256SUMS.txt',
            files.map((name) => `${sha256(readFileSync(`release-assets/${name}`))}  ${name}\n`).join(''),
          );
          console.log(`Verified termexo-fleet-${version}.tgz (${(archiveBytes.length / 1048576).toFixed(2)} MiB) and ${files.length} release files.`);
          NODE

      - name: Prepare draft GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          ## Termexo Fleet ${TAG}

          Cross-platform desktop installers & bundled multi-platform npm distribution for **Windows (x64)**, **macOS (Apple Silicon & Intel)**, and **Linux (x64)**.

          ### Quick Start via npm (Node.js 18.18+, no extra download on launch)
          \`\`\`bash
          npx termexo-fleet@${VERSION}
          # or install globally
          npm install --global termexo-fleet@${VERSION}
          termexo-fleet
          \`\`\`

          ### Direct Desktop Installers
          - **Windows (x64)**: \`Termexo-Fleet_${VERSION}_x64-setup.exe\` (NSIS) / \`Termexo-Fleet_${VERSION}_x64_en-US.msi\`
          - **macOS (Apple Silicon)**: \`Termexo-Fleet_${VERSION}_aarch64.dmg\`
          - **macOS (Intel)**: \`Termexo-Fleet_${VERSION}_x64.dmg\`
          - **Linux (x64 Debian / Ubuntu)**: \`Termexo-Fleet_${VERSION}_amd64.deb\` / \`Termexo-Fleet_${VERSION}_linux_x64.tar.gz\`

          All files are verified by \`SHA256SUMS.txt\`.
          EOF
          )

          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            node --input-type=module -e "import fs from 'node:fs'; if (!JSON.parse(fs.readFileSync('release-state.json')).isDraft) throw new Error('Release is already published; refusing to replace its assets.');"
          else
            EXTRA_ARGS=()
            if [ "$PRERELEASE" = "true" ]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" --target "$COMMIT_SHA" --draft --title "Termexo Fleet $TAG" --notes "$NOTES" "${EXTRA_ARGS[@]}"
          fi
          gh release edit "$TAG" --title "Termexo Fleet $TAG" --notes "$NOTES"
          gh release upload "$TAG" release-assets/* --clobber

      - name: Check whether this exact npm package is already published
        if: env.DRY_RUN != 'true' && env.PUBLISH_NPM == 'true'
        id: npm-state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const response = await fetch(`https://registry.npmjs.org/termexo-fleet/${process.env.VERSION}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            assert.ok(response.ok, `npm registry returned ${response.status}`);
            const pkg = await response.json();
            const integrity =
              'sha512-' +
              createHash('sha512')
                .update(readFileSync(`release-assets/termexo-fleet-${process.env.VERSION}.tgz`))
                .digest('base64');
            assert.equal(pkg.dist.integrity, integrity, 'This npm version already exists with different contents.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          NODE

      - name: Upgrade npm CLI for OIDC Trusted Publishing
        if: env.DRY_RUN != 'true' && env.PUBLISH_NPM == 'true' && steps.npm-state.outputs.published != 'true'
        run: npm install -g npm@latest

      - name: Publish npm package with provenance
        if: env.DRY_RUN != 'true' && env.PUBLISH_NPM == 'true' && steps.npm-state.outputs.published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing termexo-fleet@$VERSION via NPM_TOKEN (tag: $NPM_DIST_TAG)..."
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
            npm publish "./release-assets/termexo-fleet-$VERSION.tgz" --access public --provenance --tag "$NPM_DIST_TAG"
            rm -f .npmrc
          else
            echo "Publishing termexo-fleet@$VERSION via GitHub OIDC Trusted Publishing (tag: $NPM_DIST_TAG)..."
            npm publish "./release-assets/termexo-fleet-$VERSION.tgz" --access public --provenance --tag "$NPM_DIST_TAG"
          fi

      - name: Verify published npm version integrity
        if: env.DRY_RUN != 'true' && env.PUBLISH_NPM == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const version = process.env.VERSION;
          const integrity =
            'sha512-' +
            createHash('sha512')
              .update(readFileSync(`release-assets/termexo-fleet-${version}.tgz`))
              .digest('base64');
          const deadline = Date.now() + 12 * 60 * 1000;
          for (;;) {
            const response = await fetch(`https://registry.npmjs.org/termexo-fleet/${version}`, {
              signal: AbortSignal.timeout(5000),
            }).catch((error) => {
              console.log(`Could not reach npm yet: ${error.message}`);
              return null;
            });
            if (response?.ok) {
              const pkg = await response.json();
              assert.equal(pkg.version, version);
              assert.equal(pkg.dist.integrity, integrity, 'Published npm package differs from the verified archive.');
              console.log(`Verified termexo-fleet@${version} integrity on npm.`);
              break;
            }
            assert.ok(
              !response || response.status === 404 || response.status === 429 || response.status >= 500,
              `npm registry returned ${response?.status}`,
            );
            assert.ok(Date.now() < deadline, 'Timed out waiting for npm registry propagation.');
            console.log('Waiting for npm registry propagation...');
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          NODE

      - name: Publish completed GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          {
            echo "### Termexo Fleet $TAG published"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            if [ "$PUBLISH_NPM" = "true" ]; then
              echo "npm: https://www.npmjs.com/package/termexo-fleet/v/$VERSION"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
